version: '3.8'

services:
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.production
    ports:
      - "3000:3000"
    depends_on:
      - backend
    env_file:
      - ./client/.env.production
    environment:
      - NODE_ENV=production

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile.production
    ports:
      - "3031:3031"
    env_file:
      - ./server/.env.production
    environment:
      - NODE_ENV=production
